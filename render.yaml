# Render Blueprint for Fish finder
# https://render.com/docs/blueprint-spec
#
# One Node web service (HTTP + WebSockets on the same port) and one
# Postgres database that stores round results and all-time catch totals.

services:
  - type: web
    name: fish-finder
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: fish-finder-db
          property: connectionString
      # Length of a round in seconds.
      - key: ROUND_SECONDS
        value: "180"
      # Bots fill the sea until this many boats are on the water.
      - key: MIN_BOATS
        value: "4"

databases:
  - name: fish-finder-db
    plan: free
    region: oregon
    databaseName: fishfinder
    user: fishfinder
    ipAllowList: [] # only reachable from services inside this Render account
